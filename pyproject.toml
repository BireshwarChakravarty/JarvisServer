permission.microphone = "JARVIS listens for “Hey Jarvis” and your voice commands. Audio is processed on this Mac."
permission.camera = "JARVIS recognises you, greets you when you sit down, reads your hand gestures and answers “what am I holding?”."
info."NSAppleEventsUsageDescription" = "JARVIS controls apps like Music, Messages, Notes and Finder when you ask him to."
info."NSCalendarsUsageDescription" = "JARVIS reads your agenda for briefings and adds events you ask for."
info."NSCalendarsFullAccessUsageDescription" = "JARVIS reads your agenda for briefings and adds events you ask for."
info."NSRemindersUsageDescription" = "JARVIS reads and creates reminders for you."
info."NSRemindersFullAccessUsageDescription" = "JARVIS reads and creates reminders for you."
info."NSContactsUsageDescription" = "JARVIS looks up people when you ask him to message them."
info."LSApplicationCategoryType" = "public.app-category.productivity"
info."NSHighResolutionCapable" = true
entitlement."com.apple.security.automation.apple-events" = true

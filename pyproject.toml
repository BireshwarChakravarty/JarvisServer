[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "jarvis-mac"
version = "1.0.0"
description = "J.A.R.V.I.S. — a voice-first, camera-aware AI assistant for macOS"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  "anthropic>=2.0",
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "pyyaml>=6.0",
  "numpy>=1.26",
  "psutil>=5.9",
  "httpx>=0.27",
  "feedparser>=6.0",
  "python-dotenv>=1.0",
  "pillow>=10.0",
]

[project.optional-dependencies]
# Everything needed for the full voice + camera experience on a Mac.
voice = [
  "sounddevice>=0.4.6",
  "soundfile>=0.12",
  "openwakeword>=0.6.0",
  "webrtcvad-wheels>=2.0.11",
  "faster-whisper>=1.0.0",
]
apple = [
  # Apple-Silicon accelerated speech (Metal / MLX)
  "mlx-whisper>=0.4.1; platform_system == 'Darwin' and platform_machine == 'arm64'",
  "mlx-audio>=0.2.0; platform_system == 'Darwin' and platform_machine == 'arm64'",
  "pyobjc-framework-Quartz>=10.0; platform_system == 'Darwin'",
  "pyobjc-framework-Cocoa>=10.0; platform_system == 'Darwin'",
  "pyobjc-framework-EventKit>=10.0; platform_system == 'Darwin'",
]
vision = [
  "opencv-contrib-python>=4.9",
  "mediapipe>=0.10.14",
]
ui = [
  "pywebview>=5.0",
  "pynput>=1.7.6",
]
tts-onnx = ["kokoro-onnx>=0.4.0"]
mcp = ["mcp>=1.2"]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]
all = ["jarvis-mac[voice,apple,vision,ui,mcp]"]

[project.scripts]
jarvis = "jarvis.__main__:main"

[tool.setuptools.packages.find]
include = ["jarvis*"]

[tool.setuptools.package-data]
jarvis = ["hud/static/*", "config/*.yaml"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

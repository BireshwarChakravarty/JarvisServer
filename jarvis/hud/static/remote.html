<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#030508">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="JARVIS">
<link rel="apple-touch-icon" href="/remote/static/vendor/apple-touch-icon.png">
<link rel="manifest" href="/remote/manifest.webmanifest">
<title>JARVIS</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@200;300;400;500;600&family=Geist+Mono:wght@500&display=swap">
<link rel="stylesheet" href="/remote/static/remote.css">
</head>
<body data-state="idle">
<!-- Not paired yet -->
<section id="unpaired" class="center" hidden>
  <p class="eyebrow">J.A.R.V.I.S.</p>
  <h1>Pair with your Mac</h1>
  <p class="lede">On your Mac, open JARVIS's menu-bar icon and choose <b>Pair iPhone or iPad…</b>, then scan the code
    with this device's Camera.</p>
  <p class="err" id="pair-err"></p>
</section>

<!-- The companion -->
<main id="app" hidden>
  <header class="top">
    <span class="link"><i class="led" id="led"></i><span id="link">Connecting…</span></span>
    <span class="wx" id="wx"></span>
  </header>

  <section class="presence">
    <div id="core"><canvas id="core-gl"></canvas><canvas id="core-ui"></canvas></div>
    <p class="status"><span class="pip"></span><span id="state">Standby</span></p>
    <p class="you" id="you"></p>
    <p class="jarvis" id="jarvis" aria-live="polite"></p>
  </section>

  <section class="controls" aria-label="Controls">
    <button class="ctl" id="c-stop" aria-label="Stop"><svg viewBox="0 0 24 24"><rect x="7" y="7" width="10" height="10" rx="2" class="solid"/></svg><span>Stop</span></button>
    <button class="ctl" id="c-mute" aria-pressed="false" aria-label="Mute the Mac's microphone"><svg viewBox="0 0 24 24"><rect x="9" y="2.5" width="6" height="11.5" rx="3"/><path d="M5.5 10.5a6.5 6.5 0 0 0 13 0M12 17v4M8.5 21h7"/><path class="cut" d="M4 3.5l16 17"/><path d="M4 3.5l16 17"/></svg><span>Mute</span></button>
    <button class="ctl" id="c-hand" aria-pressed="false" aria-label="Hand control"><svg viewBox="0 0 24 24"><path d="M8 12V6.5a1.5 1.5 0 0 1 3 0V11M11 10.5V5a1.5 1.5 0 0 1 3 0v5.5M14 10.5V6.5a1.5 1.5 0 0 1 3 0V14a6 6 0 0 1-6 6h-.6a5 5 0 0 1-3.9-1.9L4.3 15a1.5 1.5 0 0 1 2.3-1.9L8 14.5"/></svg><span>Hands</span></button>
    <button class="ctl" id="c-lock" aria-label="Lock the Mac"><svg viewBox="0 0 24 24"><rect x="5" y="10.5" width="14" height="10" rx="2.5"/><path d="M8.5 10.5V7.5a3.5 3.5 0 0 1 7 0v3"/></svg><span>Lock Mac</span></button>
    <button class="ctl" id="c-show" aria-label="Show JARVIS on the Mac"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="12.5" rx="2"/><path d="M9 20.5h6M12 16.5v4"/></svg><span>Show</span></button>
  </section>

  <section class="next" id="next" hidden></section>

  <section class="protos">
    <h2 class="label">Protocols</h2>
    <div class="chips" id="protocols"></div>
  </section>

  <form class="ask" id="ask" autocomplete="off">
    <input id="text" placeholder="Ask JARVIS anything…" enterkeyhint="send" aria-label="Ask JARVIS">
    <button type="submit" id="send" aria-label="Send"><svg viewBox="0 0 24 24"><path d="M5 12h13M13 6l6 6-6 6"/></svg></button>
  </form>

  <div class="sheet" id="confirm" role="dialog" aria-modal="true" aria-labelledby="confirm-q" hidden>
    <p class="label">JARVIS asks</p>
    <p class="q" id="confirm-q"></p>
    <div class="yn"><button class="btn" id="no">No</button><button class="btn gold" id="yes">Yes</button></div>
  </div>
  <div class="toast" id="toast" role="status" hidden></div>
</main>
<script src="/remote/static/reactor.js"></script>
<script src="/remote/static/remote.js"></script>
</body>
</html>

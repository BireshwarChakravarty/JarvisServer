# ──────────────────────────────────────────────────────────────────────────
#  J.A.R.V.I.S. default configuration
#  Copy to ~/.jarvis/config.yaml and override only what you need —
#  your file is deep-merged on top of this one.
# ──────────────────────────────────────────────────────────────────────────

owner:
  name: "Tony"             # your first name
  title: "sir"             # how JARVIS addresses you: sir / ma'am / boss / your name
  timezone: ""             # IANA name, e.g. "Asia/Kolkata". Empty = system timezone.

location:
  city: "London"           # used for weather + context
  latitude: null           # optional: skip geocoding if set
  longitude: null
  units: metric            # metric | imperial

brain:
  provider: claude-code    # claude-code (your Claude Pro/Max plan) | codex (your ChatGPT plan)
                           # | anthropic (API key) | ollama (offline, no tools)
  quick_answers: true      # time, timers, music, volume, lock: answered instantly, no AI round trip
  speed: balanced          # balanced (natural, the default) | fast (a beat quicker, plainer) | thorough (thinks longer)
  claude_model: null       # used by balanced/thorough: "sonnet", "opus"; null = your plan's default
  codex_model: null
  model: claude-opus-5-5   # used by the API-key provider
  effort: low              # low | medium | high — low keeps spoken replies snappy
  fast_mode: false         # Claude fast mode (premium pricing, ~2.5x faster output)
  max_tokens: 8000
  web_search: true         # Anthropic server-side web search
  server_fallbacks: true   # retry on another model server-side if a request is declined
  session_idle_minutes: 15 # start a fresh conversation after this much silence
  session_max_turns: 40    # roll the conversation into a summary after this many turns
  ollama:
    host: "http://localhost:11434"
    model: "llama3.2"

voice:
  enabled: true
  wake_word: "hey_jarvis"  # openWakeWord model name or a path to a custom .onnx/.tflite
  wake_threshold: 0.5
  input_device: null       # null = system default; or a name fragment, e.g. "MacBook Pro Microphone"
  output_device: null
  follow_up_seconds: 8     # after he asks you something, keep listening this long (no wake word needed)
  follow_up_after_answer: 6  # after a plain answer, a shorter window, so the room isn't taken for you
  read_tone: true          # notice how you sound (hurried, tired, upbeat) compared with usual, so replies fit
  follow_up_level: 0.3     # a follow-up must be at least this loud relative to you (else it's background)
  barge_in: true           # say "Jarvis" / raise your palm while he talks to interrupt
  echo_cancellation: true  # Apple voice processing (as FaceTime uses): the mic never hears his own voice
  voice_id: true           # once you've said "learn my voice", he answers only you
  voice_id_threshold: 0.45 # how sure he must be it's you (higher: stricter)
  push_to_talk_key: "alt_r"  # hold to talk (needs Accessibility permission); null to disable
  max_utterance_seconds: 60
  smart_turn: true         # judge when you've finished speaking from your voice, not a fixed silence
  turn_patience: 2.5       # mid-thought pauses: wait up to this long before answering
  end_silence: 1.0         # a pause this long ends your turn when Smart Turn can't tell
  turn_threshold: 0.8      # Smart Turn must be this sure you've finished to answer sooner
  spoken_acks: true        # answer "Hey Jarvis" with a word ("Yes?") instead of a chime
  stt:
    backend: auto          # auto | faster-whisper | mlx
    model: "small.en"      # small.en is fast and accurate; medium.en is more accurate, slower
    language: "en"
  live:                    # natural conversation through Gemini Live (needs a free Gemini key, set in Settings)
    enabled: true
    voice: Charon          # Charon, Orus, Algieba, Alnilam, Sulafat, Algenib (or any of Google's 30 voices)
    accent: british        # british | irish | american | neutral
  tts:
    backend: auto          # auto | kokoro-onnx | kokoro-mlx | say
    voice: "butler"         # natural voices (Qwen3-TTS): butler | gentleman | friday | friday_calm; Classic (Kokoro): jarvis | lewis
    speed: 1.0             # measured, unhurried
    say_voice: "auto"      # Apple voice: auto picks the best British male installed (Jamie/Daniel Premium first)
    fillers: true          # "One moment, sir." when an answer takes a while

vision:
  enabled: true
  camera_index: 0
  fps: 30                 # smoother hand tracking; recognition is throttled separately
  face_recognition: true
  gestures: true
  hand_control_idle_minutes: 10   # hand control (all gestures + air mouse) is off until you ask; it turns itself off after this long without a hand
  wake_on_return: true     # back at a locked Mac: wake the screen, ready for Touch ID / Apple Watch
  greet_on_arrival: true   # greet you when you sit down after being away
  away_minutes: 10         # how long you must be gone to count as "away"
  auto_lock_when_away: false
  sentry_mode: false       # snapshot + notify if an unknown face appears while you're away
  recognition_threshold: 0.42  # SFace cosine similarity (higher = stricter)

greeting:
  on_login: true
  on_unlock: true
  min_gap_minutes: 45      # don't re-greet more often than this
  briefing: true
  news_feeds:
    - "https://feeds.bbci.co.uk/news/world/rss.xml"
    - "https://hnrss.org/frontpage"

app:
  theme: arc               # arc (Arc Reactor), dot (Dot Matrix), glass (Midnight Glass) or stark
  clock_24h: true          # true: 13:05 (the default) · false: 1:05 PM · null: follow the Mac's 24-hour time setting
  mini_panel: true         # a floating mini JARVIS while the window is minimised, closed or hidden
  mini_hide_when_idle: true  # it appears only while he listens, thinks or speaks, then fades away
  mini_position: null      # remembered after you drag it
  companion: false         # iPhone / iPad companion on your home network (pair by QR code)

hud:
  enabled: true
  host: "127.0.0.1"
  port: 7777
  window: true             # native frameless window (pywebview). false = open in your browser
  fullscreen: false
  always_on_top: false
  toggle_hotkey: "<cmd>+<shift>+j"

safety:
  confirm_risky_actions: true  # JARVIS asks before sending messages, running shell, etc.
  allow_shell: true
  shell_allowlist: []          # e.g. ["git", "brew", "ls"]. Empty = any command (still confirmed)

# Extra tools via Model Context Protocol servers (stdio). Example:
# mcp_servers:
#   filesystem:
#     command: "npx"
#     args: ["-y", "@modelcontextprotocol/server-filesystem", "/Users/you/Documents"]
mcp_servers: {}

name: speed lab

# Times the natural-voice options on Apple Silicon (see scripts/speed_lab.py).
# Runs when the lab itself changes, or by hand.
on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/speed_lab.py"
      - ".github/workflows/speed-lab.yml"

jobs:
  lab:
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install --upgrade pip "mlx-audio==0.6.7" soundfile numpy tokenizers sentencepiece
      - name: Run the lab
        run: python scripts/speed_lab.py speed-lab jarvis/voice/voices
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: speed-lab
          path: speed-lab/

name: ears lab

# Compares speech recognisers on Apple Silicon (see scripts/ears_lab.py). Runs when the lab changes.
on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/ears_lab.py"
      - ".github/workflows/ears-lab.yml"

jobs:
  lab:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install --upgrade pip "faster-whisper==1.2.1" "ctranslate2==4.9.0" "kokoro-onnx==0.6.1" numpy
      - name: Kokoro model
        run: |
          mkdir -p models
          for f in kokoro-v1.0.onnx voices-v1.0.bin; do
            curl -sfL -o "models/$f" "https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/$f"
          done
      - name: Run the lab
        run: python scripts/ears_lab.py ears-lab models
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ears-lab
          path: ears-lab/results.json

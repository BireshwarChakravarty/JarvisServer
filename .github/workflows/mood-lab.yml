name: mood lab

# Makes and tries mood recordings for the natural voices (see scripts/mood_lab.py).
# Runs when the lab itself changes, or by hand.
on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/mood_lab.py"
      - ".github/workflows/mood-lab.yml"

jobs:
  lab:
    runs-on: macos-15
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install --upgrade pip "mlx-audio==0.6.7" soundfile numpy tokenizers sentencepiece
      - name: Run the lab
        run: python scripts/mood_lab.py mood-lab jarvis/voice/voices
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mood-lab
          path: mood-lab/

name: macOS app

# Builds JARVIS.app on an Apple Silicon Mac, proves it works by running the
# end-to-end self-test *inside the built bundle*, then publishes a DMG.
on:
  push:
    branches: [claude/eager-newton-yifemd, main]
    paths-ignore: ["**.md", "docs/**"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: macos-app-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15          # Apple Silicon (arm64)
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Briefcase
        run: python -m pip install --upgrade pip "briefcase==0.4.7"

      - name: Install the official Claude Code CLI (for the subscription-brain tests)
        run: |
          npm install -g @anthropic-ai/claude-code
          echo "CLAUDE_BIN=$(which claude)" >> "$GITHUB_ENV"
          claude --version

      - name: Unit tests (source)
        run: |
          python -m pip install -e ".[dev]"
          python -m pytest -q -rs

      - name: Create app bundle
        run: briefcase create macOS app --no-input

      - name: Build app bundle
        run: briefcase build macOS app --no-input

      - name: Self-test inside JARVIS.app
        timeout-minutes: 30
        env:
          JARVIS_SELFTEST: "1"
          JARVIS_HOME: ${{ runner.temp }}/jarvis-home
          JARVIS_SELFTEST_OUT: ${{ runner.temp }}/selftest.json
          JARVIS_SELFTEST_LOG: ${{ runner.temp }}/selftest.log
        run: |
          export JARVIS_SELFTEST_CLAUDE_BIN="$CLAUDE_BIN"
          APP=$(ls -d build/jarvis/macos/app/*.app | head -1)
          echo "APP=$APP" >> "$GITHUB_ENV"
          EXE="$APP/Contents/MacOS/$(ls "$APP/Contents/MacOS" | head -1)"
          echo "Running $EXE"
          : > "$JARVIS_SELFTEST_LOG"
          "$EXE" > "${{ runner.temp }}/stdout.log" 2>&1 &
          PID=$!
          tail -n +1 -f "$JARVIS_SELFTEST_LOG" &
          TAIL=$!
          for i in $(seq 1 1500); do kill -0 $PID 2>/dev/null || break; sleep 1; done
          if kill -0 $PID 2>/dev/null; then echo "::error::self-test still running after 25 min"; kill -9 $PID; fi
          code=0; wait $PID || code=$?
          sleep 1; kill $TAIL 2>/dev/null || true
          echo "exit code: $code"
          echo "--- app stdout/stderr (tail) ---"; tail -60 "${{ runner.temp }}/stdout.log" || true
          if [ ! -f "$JARVIS_SELFTEST_OUT" ]; then
            echo "::error::self-test produced no report"
            log show --last 30m --predicate 'process == "JARVIS"' --style compact 2>/dev/null | tail -150 || true
            exit 1
          fi
          python3 -c "import json,sys; r=json.load(open('$JARVIS_SELFTEST_OUT')); sys.exit(0 if r['ok'] else 1)"

      - name: Launch JARVIS.app like a user (window, server, onboarding, then full boot)
        timeout-minutes: 10
        env:
          HOMEDIR: ${{ runner.temp }}/jarvis-home
        run: |
          EXE="$APP/Contents/MacOS/$(ls "$APP/Contents/MacOS" | head -1)"
          check_one_instance() {
            n=$(pgrep -f "$APP/Contents/MacOS" | wc -l | tr -d ' ')
            echo "JARVIS processes: $n"; [ "$n" -le 2 ] || { echo "::error::app relaunch loop ($n processes)"; pgrep -fl JARVIS; exit 1; }
          }
          wait_port() { for i in $(seq 1 90); do curl -s -o /dev/null http://127.0.0.1:7777/api/status && return 0; sleep 1; done; return 1; }

          echo "── 1. fresh install: should open onboarding"
          rm -f "$HOMEDIR/.setup-complete"
          JARVIS_HOME="$HOMEDIR" "$EXE" > "${{ runner.temp }}/launch1.log" 2>&1 &
          PID=$!
          wait_port || { echo "::error::server never came up"; tail -80 "$HOMEDIR/jarvis.log"; exit 1; }
          sleep 5; kill -0 $PID || { echo "::error::app exited"; tail -80 "$HOMEDIR/jarvis.log"; exit 1; }
          check_one_instance
          curl -sf http://127.0.0.1:7777/setup | grep -q "Set up JARVIS"
          curl -sf http://127.0.0.1:7777/api/setup/state | python3 -c "import sys,json; s=json.load(sys.stdin); print({k: s[k] for k in ('complete','login_item','app_path')}); assert not s['complete']"
          echo "drive the onboarding API the way the setup screens do"
          api() { curl -sf -X "$1" -H 'Content-Type: application/json' ${3:+-d "$3"} "http://127.0.0.1:7777$2"; echo; }
          api POST /api/setup/profile '{"name":"Tester","title":"sir","city":"London","units":"metric"}'
          api GET  /api/setup/devices
          api POST /api/setup/devices '{"camera_index":0}'
          api GET  "/api/setup/geocode?q=Kolkata"
          api POST /api/setup/permissions/microphone
          api GET  /api/setup/permissions
          api POST /api/setup/camera/start
          api POST /api/setup/camera/stop
          api POST /api/setup/speak '{"text":"Good evening. All systems online."}'
          curl -s --max-time 40 -X POST http://127.0.0.1:7777/api/setup/wake-test; echo
          api GET  /api/setup/models
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST -H 'Content-Type: application/json' -d '{}' http://127.0.0.1:7777/api/setup/finish)
          echo "finish without an API key -> HTTP $code (expected 400)"; [ "$code" = "400" ]
          sleep 3; kill -0 $PID || { echo "::error::app died during onboarding calls"; tail -80 "$HOMEDIR/jarvis.log"; exit 1; }
          check_one_instance
          echo "second launch should hand over to the running instance and exit"
          JARVIS_HOME="$HOMEDIR" "$EXE" & P2=$!; sleep 8; ! kill -0 $P2 2>/dev/null && echo "handed over ✓"
          check_one_instance
          kill $PID; sleep 2; pkill -9 -f "$APP/Contents/MacOS" || true; sleep 2

          echo "── 2. after setup: the assistant itself should boot"
          printf 'owner:\n  name: Tester\n  title: sir\nlocation:\n  city: London\n' > "$HOMEDIR/config.yaml"
          date > "$HOMEDIR/.setup-complete"
          ANTHROPIC_API_KEY=sk-ant-ci-placeholder JARVIS_HOME="$HOMEDIR" "$EXE" > "${{ runner.temp }}/launch2.log" 2>&1 &
          PID=$!
          wait_port || { echo "::error::server never came up"; tail -80 "$HOMEDIR/jarvis.log"; exit 1; }
          for i in $(seq 1 60); do
            curl -s http://127.0.0.1:7777/api/status | grep -q '"running":true' && break; sleep 1; done
          sleep 20
          kill -0 $PID || { echo "::error::app exited"; tail -120 "$HOMEDIR/jarvis.log"; exit 1; }
          check_one_instance
          curl -s http://127.0.0.1:7777/api/status; echo
          curl -sf http://127.0.0.1:7777/ | grep -q "J.A.R.V.I.S."
          echo "── jarvis.log"; tail -60 "$HOMEDIR/jarvis.log"
          grep -q "boot: J.A.R.V.I.S. core online" "$HOMEDIR/jarvis.log"
          ! grep -q "Traceback" "$HOMEDIR/jarvis.log" || { echo "::warning::traceback in log (see above)"; }
          kill $PID; sleep 2; pkill -9 -f "$APP/Contents/MacOS" || true

      - name: Package (ad-hoc signed DMG + zip)
        run: |
          briefcase package macOS app --adhoc-sign -p dmg --no-input
          mkdir -p dist
          ls -la dist
          ditto -c -k --keepParent "$APP" dist/JARVIS-macOS-AppleSilicon.zip
          DMG=$(ls dist/*.dmg | head -1)
          mv "$DMG" dist/JARVIS-macOS-AppleSilicon.dmg
          shasum -a 256 dist/JARVIS-macOS-AppleSilicon.* | tee dist/SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jarvis-macos
          path: |
            dist/*
            ${{ runner.temp }}/selftest.json
            ${{ runner.temp }}/selftest.log
          if-no-files-found: ignore

      - name: Publish release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=jarvis-latest
          git tag -f "$TAG" "$GITHUB_SHA"
          git push -f origin "refs/tags/$TAG"
          NOTES="Built from ${GITHUB_SHA::7} and verified by the in-app self-test on Apple Silicon. Download the DMG, open it and drag JARVIS to Applications."
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "JARVIS for Mac" --notes "$NOTES" --latest
            gh release upload "$TAG" dist/JARVIS-macOS-AppleSilicon.dmg dist/JARVIS-macOS-AppleSilicon.zip dist/SHA256SUMS.txt --clobber
          else
            gh release create "$TAG" --title "JARVIS for Mac" --notes "$NOTES" --latest \
              dist/JARVIS-macOS-AppleSilicon.dmg dist/JARVIS-macOS-AppleSilicon.zip dist/SHA256SUMS.txt
          fi

  # A brand-new Mac runs the exact one-line install a user would, from the published release.
  verify-install:
    needs: build
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - name: Install with the one-line installer (from the published release)
        run: |
          curl -fsSL "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${GITHUB_SHA}/scripts/install-app.sh" | bash
          ls -la /Applications/JARVIS.app/Contents/MacOS
          codesign --verify --deep --verbose=1 /Applications/JARVIS.app && echo "signature ✓"
          codesign -dvv /Applications/JARVIS.app 2>&1 | grep -E "Authority|Signature|Identifier"
          codesign -dvv /Applications/JARVIS.app 2>&1 | grep -q "Authority=JARVIS Local Code Signing" && echo "signed with this Mac's JARVIS identity ✓"
          codesign -d -r- /Applications/JARVIS.app 2>&1 | grep designated | tee "$RUNNER_TEMP/req1.txt"
          grep -q "cdhash" "$RUNNER_TEMP/req1.txt" && { echo "designated requirement is still cdhash-based"; exit 1; } || true
      - name: An update keeps the same identity (so macOS keeps your permissions)
        run: |
          sleep 5; osascript -e 'tell application "JARVIS" to quit' || pkill -f "/Applications/JARVIS.app" || true; sleep 3
          curl -fsSL "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${GITHUB_SHA}/scripts/install-app.sh" | bash
          codesign -d -r- /Applications/JARVIS.app 2>&1 | grep designated | tee "$RUNNER_TEMP/req2.txt"
          diff "$RUNNER_TEMP/req1.txt" "$RUNNER_TEMP/req2.txt" && echo "same designated requirement across updates ✓"
      - name: A fresh install wipes everything first, then opens into setup
        run: |
          sleep 5
          mkdir -p "$HOME/Library/Application Support/JARVIS" && echo "owner: {name: Test}" > "$HOME/Library/Application Support/JARVIS/config.yaml"
          curl -fsSL "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${GITHUB_SHA}/scripts/install-app.sh" | bash -s -- --fresh
          for i in $(seq 1 120); do curl -sf -o /dev/null http://127.0.0.1:7777/api/status && break; sleep 1; done
          curl -sf http://127.0.0.1:7777/api/setup/state | python3 -c "import sys,json; s=json.load(sys.stdin); assert not s['complete'] and not s['profile']['name'], s; print('fresh: setup starts from scratch ✓')"
          # left running for the next step
      - name: It opens into setup
        run: |
          for i in $(seq 1 120); do curl -sf -o /dev/null http://127.0.0.1:7777/api/status && break; sleep 1; done
          curl -sf http://127.0.0.1:7777/api/status; echo
          curl -sf http://127.0.0.1:7777/setup | grep -q "Set up JARVIS" && echo "onboarding served ✓"
          curl -sf http://127.0.0.1:7777/api/setup/state | python3 -c "import sys,json; s=json.load(sys.stdin); print('app at', s['app_path'], '| in Applications:', s['in_applications']); assert s['in_applications']"
          sleep 10
          n=$(pgrep -f "/Applications/JARVIS.app/Contents/MacOS" | wc -l | tr -d ' '); echo "processes: $n"; [ "$n" -ge 1 ] && [ "$n" -le 2 ]
          screencapture -x "$RUNNER_TEMP/first-launch.png" || true
      - name: The iPhone / iPad companion turns on, offers a pairing link, serves the app, turns off
        run: |
          curl -sf -X POST -H 'Content-Type: application/json' -d '{"enabled": true}' http://127.0.0.1:7777/api/remote/enable
          curl -sf http://127.0.0.1:7777/api/remote | python3 -c "import sys,json; s=json.load(sys.stdin); print(s['url'].split('#')[0]); assert s['running'] and ':7778/remote#pair=' in s['url']"
          curl -sf http://127.0.0.1:7778/remote | grep -q "remote.js" && echo "companion app served on :7778 ✓"
          code=$(curl -s -o /dev/null -w "%{http_code}" -X POST -H 'Content-Type: application/json' -d '{"code":"guess"}' http://127.0.0.1:7778/remote/api/pair); [ "$code" = 403 ] && echo "bad pairing code refused ✓"
          curl -sf -X POST -H 'Content-Type: application/json' -d '{"enabled": false}' http://127.0.0.1:7777/api/remote/enable
      - name: A Quit request really quits (as at shutdown, restart and log-out)
        run: |
          osascript -e 'tell application "JARVIS" to quit'
          for i in $(seq 1 15); do pgrep -f "/Applications/JARVIS.app/Contents/MacOS" >/dev/null || break; sleep 1; done
          if pgrep -f "/Applications/JARVIS.app/Contents/MacOS" >/dev/null; then echo "JARVIS ignored Quit: it would block shutdown"; exit 1; fi
          echo "quit honoured ✓"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: first-launch-screenshot
          path: ${{ runner.temp }}/first-launch.png
          if-no-files-found: ignore
